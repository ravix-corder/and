<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Remote Android</title>
    <style>
      :root {
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      main,
      #screen {
        width: 100vw;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #screen {
        touch-action: none;
      }

      @supports not (height: 100dvh) {
        html,
        body,
        main,
        #screen {
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="screen" aria-label="Android remote display"></div>
    </main>
    <script type="module">
      import RFB from '/core/rfb.js';

      const screen = document.getElementById('screen');
      const websocketProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const websocketUrl = `${websocketProtocol}//${window.location.host}/websockify`;
      let rfb;
      let reconnectTimer;

      function connect() {
        window.clearTimeout(reconnectTimer);
        rfb = new RFB(screen, websocketUrl);
        rfb.scaleViewport = true;
        rfb.clipViewport = false;
        rfb.viewOnly = false;

        rfb.addEventListener('disconnect', () => {
          reconnectTimer = window.setTimeout(connect, 1000);
        });
      }

      connect();
    </script>
  </body>
</html>
