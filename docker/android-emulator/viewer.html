<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Remote Android</title>
    <style>
      :root {
        background: #101418;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101418;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 12px;
      }

      iframe {
        width: min(100%, calc((100vh - 24px) * 9 / 16));
        height: min(100%, calc((100vw - 24px) * 16 / 9));
        border: 0;
        background: #000;
        box-shadow: 0 12px 36px rgb(0 0 0 / 45%);
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        title="Android remote display"
        src="/vnc.html?autoconnect=true&amp;resize=scale&amp;quality=6"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </body>
</html>
