<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Remote Android</title>
    <style>
      :root {
        background: #101418;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100dvh;
        margin: 0;
        padding: 0;
      }

      iframe {
        width: min(100vw, calc(100dvh * 9 / 16));
        height: 100dvh;
        border: 0;
        background: #000;
      }

      @supports not (height: 100dvh) {
        html,
        body,
        main,
        iframe {
          height: 100vh;
        }

        iframe {
          width: min(100vw, calc(100vh * 9 / 16));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <iframe
        title="Android remote display"
        src="/vnc.html?autoconnect=true&amp;resize=scale&amp;quality=6"
        allow="clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </body>
</html>
