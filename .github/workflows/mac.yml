name: macOS GUI / VNC diagnostic

on:
  workflow_dispatch:

jobs:
  gui:
    # Intel macOSを固定
    runs-on: macos-15-intel

    timeout-minutes: 20

    steps:
      - name: System information
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== macOS ====="
          sw_vers

          echo "===== Architecture ====="
          uname -m

          echo "===== User ====="
          id

          echo "===== DISPLAY ====="
          echo "DISPLAY=${DISPLAY:-<empty>}"

          echo "===== WindowServer ====="
          pgrep -alf WindowServer || true

          echo "===== LoginWindow ====="
          pgrep -alf loginwindow || true

      - name: Check GUI session
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== Console user ====="
          stat -f '%Su' /dev/console || true

          echo "===== GUI processes ====="
          pgrep -alf \
            'WindowServer|loginwindow|Dock|Finder|SystemUIServer' || true

          echo "===== launch services ====="
          launchctl print system/com.apple.WindowServer 2>&1 || true
          launchctl print system/com.apple.screensharing 2>&1 || true

      - name: Check Screen Sharing / VNC
        shell: bash
        run: |
          set -u

          echo "===== Port 5900 ====="
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

          echo "===== Screen Sharing process ====="
          pgrep -alf 'screensharing|screensharingd' || true

          echo "===== Screen Sharing launchd service ====="
          sudo launchctl print system/com.apple.screensharing 2>&1 || true

          echo "===== RESULT ====="

          if sudo lsof -nP -iTCP:5900 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "VNC_PORT_OPEN=true"
          else
            echo "VNC_PORT_OPEN=false"
            echo ""
            echo "The GitHub-hosted macOS runner does not currently expose"
            echo "a usable VNC server on TCP/5900."
            echo ""
            echo "noVNC cannot work without a VNC server."
          fi

      - name: Install noVNC from upstream
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --depth 1 \
            https://github.com/novnc/noVNC.git \
            "$RUNNER_TEMP/noVNC"

          test -x "$RUNNER_TEMP/noVNC/utils/novnc_proxy"

          echo "noVNC installed:"
          "$RUNNER_TEMP/noVNC/utils/novnc_proxy" --help | head -30

      - name: Start noVNC only if VNC exists
        shell: bash
        run: |
          set -u

          if ! sudo lsof -nP -iTCP:5900 -sTCP:LISTEN >/dev/null 2>&1; then
            echo "ERROR: No VNC server is listening on TCP/5900."
            echo "Stopping here intentionally."
            exit 1
          fi

          "$RUNNER_TEMP/noVNC/utils/novnc_proxy" \
            --listen 6080 \
            --vnc 127.0.0.1:5900 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &

          PID=$!
          echo "$PID" > "$RUNNER_TEMP/novnc.pid"

          sleep 3

          if ! kill -0 "$PID" 2>/dev/null; then
            echo "ERROR: noVNC exited."
            cat "$RUNNER_TEMP/novnc.log"
            exit 1
          fi

          echo "noVNC is running."

      - name: Verify noVNC
        shell: bash
        run: |
          set -euxo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:6080/vnc.html \
            >/dev/null

          echo "noVNC HTTP server is working."

      - name: Keep session alive
        shell: bash
        run: |
          echo "GUI/VNC test environment is alive."

          for i in {1..10}; do
            echo "===== $i/10 ====="

            sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true
            sudo lsof -nP -iTCP:6080 -sTCP:LISTEN || true

            sleep 60
          done

      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/diagnostics"

          sw_vers \
            > "$RUNNER_TEMP/diagnostics/sw_vers.txt" 2>&1 || true

          pgrep -alf WindowServer \
            > "$RUNNER_TEMP/diagnostics/windowserver.txt" 2>&1 || true

          pgrep -alf screensharing \
            > "$RUNNER_TEMP/diagnostics/screensharing.txt" 2>&1 || true

          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN \
            > "$RUNNER_TEMP/diagnostics/vnc.txt" 2>&1 || true

          sudo lsof -nP -iTCP:6080 -sTCP:LISTEN \
            > "$RUNNER_TEMP/diagnostics/novnc.txt" 2>&1 || true

          launchctl print system/com.apple.screensharing \
            > "$RUNNER_TEMP/diagnostics/screensharing-launchctl.txt" \
            2>&1 || true

          cp "$RUNNER_TEMP/novnc.log" \
            "$RUNNER_TEMP/diagnostics/novnc.log" \
            2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-diagnostics
          path: ${{ runner.temp }}/diagnostics
