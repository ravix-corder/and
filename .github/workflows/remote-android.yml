---
name: Remote Android 14 (Google Play)

"on":
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Remote session duration in minutes'
        required: true
        default: '45'
        type: choice
        options:
          - '15'
          - '30'
          - '45'
          - '60'
      install_user_apks:
        description: 'Install the supplied Microsoft Bing and Edge APK files'
        required: true
        default: false
        type: boolean
      bing_apk_url:
        description: 'HTTPS URL of the signed Microsoft Bing APK'
        required: false
        type: string
      edge_apk_url:
        description: 'HTTPS URL of the signed x86 Microsoft Edge APK'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: remote-android-session
  cancel-in-progress: true

jobs:
  remote-android:
    name: Android 14 / Google Play / noVNC
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOVNC_PASSWORD: ${{ secrets.NOVNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      IMAGE_NAME: remote-android:api-34-playstore
      INSTALL_USER_APKS: ${{ inputs.install_user_apks }}
      BING_APK_URL: ${{ inputs.bing_apk_url }}
      EDGE_APK_URL: ${{ inputs.edge_apk_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM access for Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=' , OPTIONS+="static_node=kvm"'
          rule="${rule/ , /, }"
          echo "${rule}" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm

      - name: Build Android emulator image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file docker/android-emulator/Dockerfile \
            --tag "${IMAGE_NAME}" \
            .

      - name: Start password-protected Android emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${NOVNC_PASSWORD:-}" ]; then
            echo 'Repository secret NOVNC_PASSWORD is required.' >&2
            exit 1
          fi

          docker run --detach --rm \
            --name remote-android \
            --device /dev/kvm \
            --publish 127.0.0.1:6080:6080 \
            --shm-size=2g \
            --cpus=2 \
            --memory=6g \
            --security-opt no-new-privileges:true \
            --env NOVNC_PASSWORD \
            --env EMULATOR_WIDTH=1920 \
            --env EMULATOR_HEIGHT=1080 \
            --env EMULATOR_DENSITY=560 \
            "${IMAGE_NAME}"

          for _ in $(seq 1 360); do
            state_format='{{.State.Running}}'
            container_name=remote-android
            running="$(docker inspect --format "${state_format}" \
              "${container_name}")"
            if [ "${running}" != "true" ]; then
              echo 'Android container stopped before it became ready.' >&2
              docker logs remote-android || true
              exit 1
            fi

            if docker exec remote-android test -f /tmp/android-ready; then
              echo 'Android emulator is ready.'
              exit 0
            fi
            sleep 2
          done

          echo 'Timed out waiting for Android emulator boot.' >&2
          docker logs remote-android || true
          docker exec remote-android sh -c \
            'tail -n 120 /tmp/emulator.log /tmp/xvfb.log /tmp/nginx.log' || true
          exit 1

      - name: Install and verify supplied Microsoft apps
        shell: bash
        run: |
          set -Eeuo pipefail
          edge_status='not requested'
          bing_status='not requested'
          if [ "${INSTALL_USER_APKS}" != 'true' ]; then
            echo 'No user APK installation was requested.'
            echo "EDGE_STATUS=${edge_status}" >> "${GITHUB_ENV}"
            echo "BING_STATUS=${bing_status}" >> "${GITHUB_ENV}"
            exit 0
          fi

          android_boot_completed="$(docker exec remote-android \
            adb shell getprop sys.boot_completed | tr -d '\r')"
          test "${android_boot_completed}" = '1'
          echo 'Android 14 boot verification passed.'

          test -n "${BING_APK_URL}"
          test -n "${EDGE_APK_URL}"
          case "${BING_APK_URL}" in https://*) ;; *) exit 1 ;; esac
          case "${EDGE_APK_URL}" in https://*) ;; *) exit 1 ;; esac

          bing_apk="${RUNNER_TEMP}/microsoft-bing.apk"
          edge_apk="${RUNNER_TEMP}/microsoft-edge.apk"
          curl --fail --location --retry 3 --retry-all-errors \
            "${BING_APK_URL}" --output "${bing_apk}"
          curl --fail --location --retry 3 --retry-all-errors \
            "${EDGE_APK_URL}" --output "${edge_apk}"
          printf '%s  %s\n' \
            '8a11c21045254fabadf3a1e4e49badde1dff9918fa00a93f93a50c00e0387a90' \
            "${bing_apk}" | sha256sum --check --status
          printf '%s  %s\n' \
            '3d97a445afa4fc16251a9135ae662f52e16fa9db4bde9f54f1d90666fb892989' \
            "${edge_apk}" | sha256sum --check --status

          docker cp "${bing_apk}" remote-android:/tmp/microsoft-bing.apk
          docker cp "${edge_apk}" remote-android:/tmp/microsoft-edge.apk
          bing_signature="$(docker exec remote-android \
            apksigner verify --print-certs /tmp/microsoft-bing.apk)"
          edge_signature="$(docker exec remote-android \
            apksigner verify --print-certs /tmp/microsoft-edge.apk)"
          printf '%s\n' "${bing_signature}"
          printf '%s\n' "${edge_signature}"
          bing_certificate_sha256="$(printf '%s\n' "${bing_signature}" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          edge_certificate_sha256="$(printf '%s\n' "${edge_signature}" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d ':\r' | tr '[:upper:]' '[:lower:]')"
          test "${bing_certificate_sha256}" = \
            'ac46aba9236ebd5aed35994e9e88ee75d1d6b510e1d5f141b719da62dc3586fa'
          test "${edge_certificate_sha256}" = \
            '01e1999710a82c2749b4d50c445dc85d670b6136089d0a766a73827c82a1eac9'

          set +e
          bing_install_output="$(docker exec remote-android \
            adb install -r /tmp/microsoft-bing.apk 2>&1)"
          bing_install_code=$?
          set -e
          printf '%s\n' "${bing_install_output}"
          if [ "${bing_install_code}" -eq 0 ]; then
            bing_version="$(docker exec remote-android \
              adb shell dumpsys package com.microsoft.bing | tr -d '\r' \
              | sed -n 's/.*versionName=//p' | head -n 1)"
            test -n "${bing_version}"
            bing_status="installed (version ${bing_version})"
          elif printf '%s' "${bing_install_output}" \
            | grep -q 'INSTALL_FAILED_NO_MATCHING_ABIS'; then
            bing_status='not installed: Bing APK is incompatible with x86_64 Android'
          else
            echo 'Microsoft Bing installation failed unexpectedly.' >&2
            exit "${bing_install_code}"
          fi

          set +e
          edge_install_output="$(docker exec remote-android \
            adb install -r /tmp/microsoft-edge.apk 2>&1)"
          edge_install_code=$?
          set -e
          printf '%s\n' "${edge_install_output}"
          if [ "${edge_install_code}" -ne 0 ]; then
            if printf '%s' "${edge_install_output}" \
              | grep -q 'INSTALL_FAILED_NO_MATCHING_ABIS'; then
              edge_status='not installed: x86 APK is incompatible with x86_64 Android'
              echo "${edge_status}."
              if [ "${bing_install_code}" -ne 0 ]; then
                echo "EDGE_STATUS=${edge_status}" >> "${GITHUB_ENV}"
                echo "BING_STATUS=${bing_status}" >> "${GITHUB_ENV}"
                exit 0
              fi

              docker exec remote-android adb logcat -c
              bing_launch_output="$(docker exec remote-android adb shell monkey \
                -p com.microsoft.bing -c android.intent.category.LAUNCHER 1)"
              printf '%s\n' "${bing_launch_output}"
              printf '%s' "${bing_launch_output}" | grep -q 'Events injected: 1'
              sleep 2
              bing_activity="$(docker exec remote-android \
                adb shell dumpsys activity activities | tr -d '\r' \
                | grep 'com.microsoft.bing' | tail -n 1 || true)"
              test -n "${bing_activity}"
              bing_status="installed and launch activity started (version ${bing_version}); initial permission prompt may be displayed"
              echo "Microsoft Bing ${bing_status}."
              echo "EDGE_STATUS=${edge_status}" >> "${GITHUB_ENV}"
              echo "BING_STATUS=${bing_status}" >> "${GITHUB_ENV}"
              exit 0
            fi
            echo 'Microsoft Edge installation failed unexpectedly.' >&2
            exit "${edge_install_code}"
          fi

          edge_version="$(docker exec remote-android \
            adb shell dumpsys package com.microsoft.emmx | tr -d '\r' \
            | sed -n 's/.*versionName=//p' | head -n 1)"
          test -n "${edge_version}"

          docker exec remote-android adb logcat -c
          docker exec remote-android adb shell monkey \
            -p com.microsoft.emmx -c android.intent.category.LAUNCHER 1
          for _ in $(seq 1 30); do
            foreground="$(docker exec remote-android \
              adb shell dumpsys window windows | tr -d '\r' \
              | grep -m 1 'mCurrentFocus' || true)"
            if printf '%s' "${foreground}" | grep -q 'com.microsoft.emmx'; then
              edge_status="installed and launched (version ${edge_version})"
              echo "Microsoft Edge ${edge_status}."
              echo "EDGE_STATUS=${edge_status}" >> "${GITHUB_ENV}"
              echo "BING_STATUS=${bing_status}" >> "${GITHUB_ENV}"
              exit 0
            fi
            sleep 1
          done

          echo 'Microsoft Edge did not reach the foreground.' >&2
          docker exec remote-android \
            adb shell dumpsys activity activities || true
          docker exec remote-android adb logcat -d -v threadtime \
            | tail -n 500 || true
          exit 1

      - name: Verify local noVNC authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          unauthenticated_status="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:6080/vnc.html)"
          test "${unauthenticated_status}" = '401'
          curl --fail --silent --show-error \
            --user "android:${NOVNC_PASSWORD}" \
            --output /dev/null http://127.0.0.1:6080/vnc.html

      - name: Install cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          release_url='https://github.com/cloudflare/cloudflared/releases/latest/download'
          curl --fail --location --retry 5 --retry-all-errors \
            "${release_url}/cloudflared-linux-amd64" \
            --output /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start account-free Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared tunnel --url http://127.0.0.1:6080 \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          quick_tunnel_url=''
          for _ in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared stopped before creating a Quick Tunnel.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            quick_tunnel_url="$(grep -Eo \
              'https://[-a-z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | tail -n 1 || true)"
            if [ -n "${quick_tunnel_url}" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "${quick_tunnel_url}" ]; then
            echo 'Cloudflare did not return a Quick Tunnel URL' >&2
            echo 'within 60 seconds.' >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --user "android:${NOVNC_PASSWORD}" \
              --output /dev/null "${quick_tunnel_url}/vnc.html"; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            --user "android:${NOVNC_PASSWORD}" \
            --output /dev/null "${quick_tunnel_url}/vnc.html"

          remote_url="${quick_tunnel_url}/viewer.html"
          {
            echo '## Remote Android is ready'
            echo
            echo "Open **[noVNC remote console](${remote_url})** in a browser."
            echo
            echo 'HTTP Basic authentication is required.'
            echo 'Username: `android`'
            echo 'Password: the `NOVNC_PASSWORD` GitHub Actions secret.'
            echo
            echo "Microsoft Edge: **${EDGE_STATUS}**."
            echo "Microsoft Bing: **${BING_STATUS}**."
            echo 'Display: fixed 1080×1920 Android screen, centered and scaled.'
            echo "Session duration: **${SESSION_MINUTES} minutes**."
            echo 'This is a temporary Quick Tunnel for development only.'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Remote noVNC URL: ${remote_url}"
          {
            echo "noVNC URL: ${remote_url}"
            echo 'Username: android'
            echo 'Password: the NOVNC_PASSWORD GitHub Actions secret'
            echo "Microsoft Edge: ${EDGE_STATUS}"
            echo "Microsoft Bing: ${BING_STATUS}"
            echo 'Display: fixed 1080x1920, centered and scaled'
            echo "Session duration: ${SESSION_MINUTES} minutes"
          } > "${RUNNER_TEMP}/remote-android-connection.txt"

      - name: Upload remote connection details
        uses: actions/upload-artifact@v4
        with:
          name: remote-android-connection
          path: ${{ runner.temp }}/remote-android-connection.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep remote session available
        shell: bash
        run: |
          set -Eeuo pipefail
          end_time=$((SECONDS + SESSION_MINUTES * 60))
          while [ "${SECONDS}" -lt "${end_time}" ]; do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared exited unexpectedly.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            running="$(docker inspect --format '{{.State.Running}}' \
              remote-android 2>/dev/null || true)"
            if [ "${running}" != "true" ]; then
              echo 'Android container exited unexpectedly.' >&2
              docker logs remote-android || true
              exit 1
            fi
            sleep 15
          done

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker logs remote-android || true
          cat /tmp/cloudflared.log || true

      - name: Shut down remote session
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
          docker rm --force remote-android 2>/dev/null || true
