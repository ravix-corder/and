---
name: Remote Android 14 (Google Play)

"on":
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Remote session duration in minutes'
        required: true
        default: '45'
        type: choice
        options:
          - '15'
          - '30'
          - '45'
          - '60'

permissions:
  contents: read

concurrency:
  group: remote-android-session
  cancel-in-progress: true

jobs:
  remote-android:
    name: Android 14 / Google Play / noVNC
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      ANDROID_REMOTE_URL: ${{ vars.ANDROID_REMOTE_URL }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      IMAGE_NAME: remote-android:api-34-playstore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM access for Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=' , OPTIONS+="static_node=kvm"'
          rule="${rule/ , /, }"
          echo "${rule}" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm

      - name: Build Android emulator image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file docker/android-emulator/Dockerfile \
            --tag "${IMAGE_NAME}" \
            .

      - name: Start Android emulator and noVNC
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --detach --rm \
            --name remote-android \
            --device /dev/kvm \
            --publish 127.0.0.1:6080:6080 \
            --shm-size=2g \
            --cpus=2 \
            --memory=6g \
            --security-opt no-new-privileges:true \
            "${IMAGE_NAME}"

          for _ in $(seq 1 90); do
            state_format='{{.State.Running}}'
            container_name=remote-android
            running="$(docker inspect --format "${state_format}" \
              "${container_name}")"
            if [ "${running}" != "true" ]; then
              echo 'Android container stopped before it became ready.' >&2
              docker logs remote-android || true
              exit 1
            fi

            if docker exec remote-android test -f /tmp/android-ready; then
              echo 'Android emulator is ready.'
              exit 0
            fi
            sleep 2
          done

          echo 'Timed out waiting for Android emulator boot.' >&2
          docker logs remote-android || true
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/cloudflare/cloudflared/releases/latest/download/\
            cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start protected Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]; then
            echo 'Repository secret CLOUDFLARE_TUNNEL_TOKEN is required.' >&2
            exit 1
          fi
          if [ -z "${ANDROID_REMOTE_URL:-}" ]; then
            echo 'Repository variable ANDROID_REMOTE_URL is required.' >&2
            exit 1
          fi

          cloudflared tunnel --no-autoupdate run \
            --token "${CLOUDFLARE_TUNNEL_TOKEN}" \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          for _ in $(seq 1 30); do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared stopped before connecting.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            if grep -q 'Registered tunnel connection' /tmp/cloudflared.log; then
              break
            fi
            sleep 1
          done
          if ! grep -q 'Registered tunnel connection' /tmp/cloudflared.log; then
            echo 'cloudflared did not connect within 30 seconds.' >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi

          remote_url="${ANDROID_REMOTE_URL%/}/vnc.html?autoconnect=true&resize=remote"
          {
            echo '## Remote Android is ready'
            echo
            echo "Open **[noVNC remote console](${remote_url})** in a browser."
            echo
            echo "Session duration: **${SESSION_MINUTES} minutes**."
            echo 'Cloudflare Access must protect this endpoint.'
            echo 'VNC is not directly exposed on the runner network.'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Remote noVNC URL: ${remote_url}"

      - name: Keep remote session available
        shell: bash
        run: |
          set -Eeuo pipefail
          end_time=$((SECONDS + SESSION_MINUTES * 60))
          while [ "${SECONDS}" -lt "${end_time}" ]; do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared exited unexpectedly.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            running="$(docker inspect --format '{{.State.Running}}' \
              remote-android 2>/dev/null || true)"
            if [ "${running}" != "true" ]; then
              echo 'Android container exited unexpectedly.' >&2
              docker logs remote-android || true
              exit 1
            fi
            sleep 15
          done

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker logs remote-android || true
          cat /tmp/cloudflared.log || true

      - name: Shut down remote session
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
          docker rm --force remote-android 2>/dev/null || true
