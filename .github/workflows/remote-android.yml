---
name: Remote Android 14 (Google Play)

"on":
  workflow_dispatch:
    inputs:
      session_minutes:
        description: 'Remote session duration in minutes'
        required: true
        default: '45'
        type: choice
        options:
          - '15'
          - '30'
          - '45'
          - '60'

permissions:
  contents: read

concurrency:
  group: remote-android-session
  cancel-in-progress: true

jobs:
  remote-android:
    name: Android 14 / Google Play / noVNC
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NOVNC_PASSWORD: ${{ secrets.NOVNC_PASSWORD }}
      SESSION_MINUTES: ${{ inputs.session_minutes }}
      IMAGE_NAME: remote-android:api-34-playstore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable KVM access for Docker
        shell: bash
        run: |
          set -Eeuo pipefail
          rule='KERNEL=="kvm", GROUP="kvm", MODE="0666"'
          rule+=' , OPTIONS+="static_node=kvm"'
          rule="${rule/ , /, }"
          echo "${rule}" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm

      - name: Build Android emulator image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build \
            --file docker/android-emulator/Dockerfile \
            --tag "${IMAGE_NAME}" \
            .

      - name: Start password-protected Android emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${NOVNC_PASSWORD:-}" ]; then
            echo 'Repository secret NOVNC_PASSWORD is required.' >&2
            exit 1
          fi

          docker run --detach --rm \
            --name remote-android \
            --device /dev/kvm \
            --publish 127.0.0.1:6080:6080 \
            --shm-size=2g \
            --cpus=2 \
            --memory=6g \
            --security-opt no-new-privileges:true \
            --env NOVNC_PASSWORD \
            "${IMAGE_NAME}"

          for _ in $(seq 1 360); do
            state_format='{{.State.Running}}'
            container_name=remote-android
            running="$(docker inspect --format "${state_format}" \
              "${container_name}")"
            if [ "${running}" != "true" ]; then
              echo 'Android container stopped before it became ready.' >&2
              docker logs remote-android || true
              exit 1
            fi

            if docker exec remote-android test -f /tmp/android-ready; then
              echo 'Android emulator is ready.'
              exit 0
            fi
            sleep 2
          done

          echo 'Timed out waiting for Android emulator boot.' >&2
          docker logs remote-android || true
          docker exec remote-android sh -c \
            'tail -n 120 /tmp/emulator.log /tmp/xvfb.log /tmp/nginx.log' || true
          exit 1

      - name: Verify local noVNC authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          unauthenticated_status="$(curl --silent --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:6080/vnc.html)"
          test "${unauthenticated_status}" = '401'
          curl --fail --silent --show-error \
            --user "android:${NOVNC_PASSWORD}" \
            --output /dev/null http://127.0.0.1:6080/vnc.html

      - name: Install cloudflared
        shell: bash
        run: |
          set -Eeuo pipefail
          release_url='https://github.com/cloudflare/cloudflared/releases/latest/download'
          curl --fail --location --retry 5 --retry-all-errors \
            "${release_url}/cloudflared-linux-amd64" \
            --output /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start account-free Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared tunnel --url http://127.0.0.1:6080 \
            > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid

          quick_tunnel_url=''
          for _ in $(seq 1 60); do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared stopped before creating a Quick Tunnel.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            quick_tunnel_url="$(grep -Eo \
              'https://[-a-z0-9]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | tail -n 1 || true)"
            if [ -n "${quick_tunnel_url}" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "${quick_tunnel_url}" ]; then
            echo 'Cloudflare did not return a Quick Tunnel URL' >&2
            echo 'within 60 seconds.' >&2
            cat /tmp/cloudflared.log >&2 || true
            exit 1
          fi

          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --user "android:${NOVNC_PASSWORD}" \
              --output /dev/null "${quick_tunnel_url}/vnc.html"; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            --user "android:${NOVNC_PASSWORD}" \
            --output /dev/null "${quick_tunnel_url}/vnc.html"

          remote_url="${quick_tunnel_url}/vnc.html?autoconnect=true&resize=remote"
          {
            echo '## Remote Android is ready'
            echo
            echo "Open **[noVNC remote console](${remote_url})** in a browser."
            echo
            echo 'HTTP Basic authentication is required.'
            echo 'Username: `android`'
            echo 'Password: the `NOVNC_PASSWORD` GitHub Actions secret.'
            echo
            echo "Session duration: **${SESSION_MINUTES} minutes**."
            echo 'This is a temporary Quick Tunnel for development only.'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Remote noVNC URL: ${remote_url}"
          {
            echo "noVNC URL: ${remote_url}"
            echo 'Username: android'
            echo 'Password: the NOVNC_PASSWORD GitHub Actions secret'
            echo "Session duration: ${SESSION_MINUTES} minutes"
          } > "${RUNNER_TEMP}/remote-android-connection.txt"

      - name: Upload remote connection details
        uses: actions/upload-artifact@v4
        with:
          name: remote-android-connection
          path: ${{ runner.temp }}/remote-android-connection.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep remote session available
        shell: bash
        run: |
          set -Eeuo pipefail
          end_time=$((SECONDS + SESSION_MINUTES * 60))
          while [ "${SECONDS}" -lt "${end_time}" ]; do
            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo 'cloudflared exited unexpectedly.' >&2
              cat /tmp/cloudflared.log >&2 || true
              exit 1
            fi
            running="$(docker inspect --format '{{.State.Running}}' \
              remote-android 2>/dev/null || true)"
            if [ "${running}" != "true" ]; then
              echo 'Android container exited unexpectedly.' >&2
              docker logs remote-android || true
              exit 1
            fi
            sleep 15
          done

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          docker logs remote-android || true
          cat /tmp/cloudflared.log || true

      - name: Shut down remote session
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cloudflared.pid ]; then
            kill "$(cat /tmp/cloudflared.pid)" 2>/dev/null || true
          fi
          docker rm --force remote-android 2>/dev/null || true
