name: Android 15 GUI via noVNC

on:
  workflow_dispatch:

jobs:
  android-novnc:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            bridge-utils

          sudo usermod -aG kvm "$USER"
          sudo chmod 666 /dev/kvm

      - name: Install noVNC and VNC server
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            wget

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 15 emulator
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis_playstore;x86_64"

      - name: Create Android 15 Google Play emulator
        run: |
          echo "no" | avdmanager create avd \
            --name android15 \
            --package "system-images;android-35;google_apis_playstore;x86_64" \
            --device "pixel_6"

      - name: Start virtual display
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 1280x800x24 \
            -ac +extension GLX \
            +render \
            -noreset &

          sleep 2

      - name: Start Android emulator
        env:
          DISPLAY: :99
        run: |
          emulator \
            -avd android15 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -writable-system \
            > /tmp/emulator.log 2>&1 &

          echo $! > /tmp/emulator.pid

          adb wait-for-device

          echo "Waiting for Android to boot..."

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q "1"; do
              sleep 5
            done
          '

          adb shell input keyevent 82 || true

          echo "Android 15 is ready."

      - name: Start x11vnc
        env:
          DISPLAY: :99
        run: |
          x11vnc \
            -display :99 \
            -forever \
            -shared \
            -nopw \
            -listen 127.0.0.1 \
            -rfbport 5900 \
            > /tmp/x11vnc.log 2>&1 &

          sleep 3

      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > /tmp/novnc.log 2>&1 &

          sleep 3

      - name: Install Cloudflare Tunnel
        run: |
          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

      - name: Start public noVNC tunnel
        run: |
          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo "Waiting for tunnel..."
          sleep 10

          URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1)

          if [ -z "$URL" ]; then
            echo "Could not find Cloudflare tunnel URL"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo " Android 15 noVNC"
          echo ""
          echo " $URL/vnc.html"
          echo ""
          echo "=============================================="
          echo ""

      - name: Keep emulator alive
        run: |
          echo "The emulator is running."
          echo "Open the noVNC URL printed above."
          echo ""

          for i in {1..50}; do
            if ! kill -0 "$(cat /tmp/emulator.pid)" 2>/dev/null; then
              echo "Emulator stopped."
              cat /tmp/emulator.log
              exit 1
            fi

            sleep 60
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: |
            /tmp/emulator.log
            /tmp/x11vnc.log
            /tmp/novnc.log
            /tmp/cloudflared.log
